<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" style="background:#090d16; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatBeam {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(10px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -200; }
      }
      @keyframes orbitPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; }
      }

      .ambient-glow-1 {
        transform-origin: 250px 100px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .ambient-glow-2 {
        transform-origin: 950px 220px;
        animation: pulseGlow 8s ease-in-out infinite alternate;
      }
      .floating-grid {
        animation: floatBeam 9s ease-in-out infinite;
      }
      .animated-wire {
        stroke-dasharray: 8, 12;
        animation: dashFlow 12s linear infinite;
      }
      .pulsing-dot {
        transform-origin: center;
        animation: orbitPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGradient)"/>

  <!-- ================= BACKGROUND ANIMATED DYNAMIC LAYER ================= -->
  <g class="background-elements" pointer-events="none">
    <!-- Ambient Pulsing Glow Orbs -->
    <circle class="ambient-glow-1" cx="220" cy="120" r="140" fill="url(#glowGrad)" filter="url(#softGlow)"/>
    <circle class="ambient-glow-2" cx="980" cy="220" r="170" fill="url(#glowGrad)" filter="url(#softGlow)"/>

    <!-- Subtle Circuit / Connection Grid -->
    <g class="floating-grid" opacity="0.22" stroke="#38bdf8" stroke-width="1">
      <line x1="120" y1="40" x2="300" y2="40" />
      <line x1="300" y1="40" x2="380" y2="120" />
      <line x1="380" y1="120" x2="520" y2="120" />
      <line x1="680" y1="220" x2="820" y2="220" />
      <line x1="820" y1="220" x2="920" y2="140" />
      <line x1="920" y1="140" x2="1080" y2="140" />
      
      <!-- Vertical and Cross Drops -->
      <line x1="180" y1="180" x2="180" y2="290" />
      <line x1="180" y1="290" x2="320" y2="290" />
      <line x1="1020" y1="60" x2="1020" y2="190" />
    </g>

    <!-- Animated Data Flow Lines -->
    <path class="animated-wire" d="M 50 170 Q 250 80 480 170 T 920 170 T 1150 170" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.35"/>
    <path class="animated-wire" d="M 80 260 Q 320 290 600 240 T 1120 220" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.25"/>

    <!-- Dynamic Flow Nodes -->
    <circle class="pulsing-dot" cx="300" cy="40" r="4" fill="#38bdf8" />
    <circle class="pulsing-dot" cx="380" cy="120" r="4.5" fill="#818cf8" />
    <circle class="pulsing-dot" cx="820" cy="220" r="4.5" fill="#c084fc" />
    <circle class="pulsing-dot" cx="920" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (High Z-Index & Clear) ================= -->
  <g class="foreground-content">
    <!-- Top Pill / Badge -->
    <g transform="translate(600, 52)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="-140" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-125" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" letter-spacing="1">CURATED AI SDLC ECOSYSTEM</text>
    </g>

    <!-- Primary Title -->
    <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome AI Software Engineering
    </text>

    <!-- Subtitle -->
    <text x="600" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Autonomous Coding Agents • Spec-Driven Development • Enterprise Control Planes
    </text>

    <!-- Interactive / Feature Highlights Bar -->
    <g transform="translate(180, 215)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="250" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">🤖</text>
        <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Agentic SDLC</text>
        <text x="48" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8">Multi-Agent Pipelines</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(295, 0)">
        <rect width="250" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">📝</text>
        <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Spec-Driven Dev</text>
        <text x="48" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8">Structured Artifacts</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(590, 0)">
        <rect width="250" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">⚡</text>
        <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Control Planes</text>
        <text x="48" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8">Issue-Based Dispatch</text>
      </g>
    </g>

    <!-- Bottom Footer Meta -->
    <text x="600" y="304" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">
      ⭐ Updated Continuously • Curated for Platform Teams, Architects &amp; AI Engineers
    </text>
  </g>
</svg>
